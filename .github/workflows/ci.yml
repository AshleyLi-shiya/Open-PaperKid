name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-typecheck:
    name: Server typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  extension-syntax:
    name: Extension syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JSON syntax
        run: |
          for f in chrome-extension/manifest.json chrome-extension/**/*.json; do
            if [ -f "$f" ]; then node -e "JSON.parse(require('fs').readFileSync('$f'))"; fi
          done
      - name: Check JS syntax
        run: |
          set -e
          for f in $(find chrome-extension -name "*.js"); do
            node --check "$f"
          done

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: server-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: open-paperkid-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
