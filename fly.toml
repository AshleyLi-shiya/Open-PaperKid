# Fly.io configuration
# Docs: https://fly.io/docs/reference/configuration/

app = "open-paperkid-YOURNAME"
primary_region = "nrt"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  STORAGE_DIR = "/data"
  NODE_ENV = "production"

[mounts]
  source = "open_paperkid_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512